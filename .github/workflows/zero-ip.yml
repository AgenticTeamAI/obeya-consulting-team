name: Zero-IP check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Allowlist (every file is in plugin-manifest.json with a matching hash, or is
  # a repo file) plus the pattern layer over every file. Runs offline, without
  # the generator. See scripts/check_zero_ip.py.
  zero-ip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Only generated menu files and repo files, and nothing that looks like methodology
        run: python scripts/check_zero_ip.py
